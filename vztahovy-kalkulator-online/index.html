var STORE="vk_key", DAYS=30;
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function tob64(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
async function derive(pw){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(P.salt),iterations:250000,hash:"SHA-256"},km,256));
}
async function open(raw){
  var k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},k,b64(P.data));
  var stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).text();
}
function run(code){ (0,eval)(code); }
function save(raw){ try{localStorage.setItem(STORE,JSON.stringify({k:tob64(raw),s:P.salt,e:Date.now()+DAYS*864e5}));}catch(e){} }
async function auto(){
  try{
    var m=JSON.parse(localStorage.getItem(STORE)||"null");
    if(!m||m.s!==P.salt||m.e<Date.now()) return false;
    run(await open(b64(m.k))); return true;
  }catch(e){ try{localStorage.removeItem(STORE);}catch(x){} return false; }
}
auto().then(function(ok){
  if(ok) return;
  document.getElementById("login").addEventListener("submit",async function(e){
    e.preventDefault();
    var btn=document.getElementById("go"),err=document.getElementById("err");
    btn.disabled=true; err.textContent="";
    var raw, code;
    try{ raw=await derive(document.getElementById("pw").value); code=await open(raw); }
    catch(x){ err.textContent="Nesprávné heslo."; btn.disabled=false; return; }
    save(raw); run(code);
  });
});
})();
